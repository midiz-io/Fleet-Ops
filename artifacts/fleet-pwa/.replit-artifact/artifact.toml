kind = "web"
previewPath = "/"
title = "Fleet Vehicle Maintenance PWA"
version = "1.0.0"
id = "artifacts/fleet-pwa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18937

[services.development]
run = "pnpm --filter @workspace/fleet-pwa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fleet-pwa", "run", "build" ]
publicDir = "artifacts/fleet-pwa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18937"
BASE_PATH = "/"
